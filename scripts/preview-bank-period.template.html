<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Bob Bank Period Charts preview matrix</title>
  <style>
    :root { color-scheme: light; }
    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; }
    body { font: 16px/1.45 system-ui, sans-serif; padding: 0 0 24px; }
    body.theme-light {
      color-scheme: light; --background-primary: #fff; --background-secondary: #f6f5f2;
      --background-modifier-border: #d8d5cf; --background-modifier-hover: #eeece8;
      --text-normal: #262521; --text-muted: #6f6c65; --text-faint: #a7a39b;
      --text-accent: #5143ad; --interactive-accent: #6556c8;
      --radius-s: 4px; --font-interface: system-ui, sans-serif;
      --color-green: #08b94e;
      background: #eeece8; color: var(--text-normal);
    }
    body.theme-dark {
      color-scheme: dark; --background-primary: #202124; --background-secondary: #292a2e;
      --background-modifier-border: #45464c; --background-modifier-hover: #34363b;
      --text-normal: #e7e6e2; --text-muted: #a4a3a0; --text-faint: #74757a;
      --text-accent: #b2a9ff; --interactive-accent: #9a8cf0;
      --radius-s: 4px; --font-interface: system-ui, sans-serif;
      --color-green: #44cf6e;
      background: #17181a; color: var(--text-normal);
    }
    #preview-root { margin: 0 auto; width: 100%; padding: 12px; }
    .preview-case { min-width: 0; margin: 0 0 18px; }
    .preview-case-title { margin: 0 0 5px; color: var(--text-muted); font-size: 12px; font-weight: 650; }
    .preview-note {
      min-width: 0; width: 100%; padding: 8px 12px 8px;
      border: 1px solid var(--background-modifier-border); border-radius: 6px;
      background: var(--background-primary); color: var(--text-normal);
      font: 16px/1.45 var(--font-interface);
    }
    .preview-strip { width: 100%; min-width: 0; }
    .preview-report { margin-top: 16px; color: var(--text-muted); font-size: 12px; }
  </style>
  <style id="obsidian-baseline">__OBSIDIAN_BASELINE_CSS__</style>
  <style id="production-css">__PRODUCTION_CSS__</style>
</head>
<body class="theme-light">
  <main id="preview-root"></main>
  <script>
  window.__previewError = "";
  (() => {
    "use strict";
    const pluginSource = __PLUGIN_SOURCE_JSON__;
    const fixtures = __FIXTURES_JSON__;
    const moduleObject = { exports: {} };
    const modules = {
      obsidian: { Plugin: class {}, MarkdownView: class {}, MarkdownRenderChild: class {}, MarkdownView2: class {}, Notice: class {}, Platform: { isDesktopApp: false }, normalizePath: (value) => value, parseYaml: () => ({}) },
      "@codemirror/state": { Prec: { highest: (value) => value } },
      "@codemirror/view": { EditorView: { updateListener: { of: (listener) => ({ listener }) } }, keymap: { of: (value) => value } },
    };
    new Function("require", "module", "exports", "process", pluginSource)(
      (name) => modules[name] || {}, moduleObject, moduleObject.exports, { env: { HOME: "/" } },
    );
    const helpers = moduleObject.exports.helpers;
    const cases = [
      { id: "week", title: "Real-shape week · one counted day", report: "week" },
      { id: "rich-week", title: "Rich week · payday, waiting, partial, so far", report: "rich-week" },
      { id: "quarter", title: "Quarter · 14 weeks mirrored", report: "quarter" },
      { id: "year", title: "ISO year · 53 weeks with quarter fallback", report: "year" },
      { id: "all-single", title: "All time · single bucket (categories only)", report: "all-single" },
      { id: "all-collapse", title: "All time · leading untracked collapse", report: "all-collapse" },
      { id: "unavailable", title: "Unavailable · muted line", report: "unavailable" },
      { id: "stale", title: "Stale · dashed edge and hint", report: "stale" },
    ];
    function paintCase(host, entry, view) {
      const fixture = fixtures[entry.report];
      if (!fixture) {
        helpers.bankPeriodPaint(host, { state: "unavailable", reason: "missing-charts", hint: "The bank charts could not be read.", stale: false }, {});
        return { model: null };
      }
      const model = helpers.bankPeriodChartsModel(fixture.report, { ...fixture.ctx, view });
      helpers.bankPeriodPaint(host, model, {
        activateBucket: () => {},
        openWaiting: () => {},
        setView: () => {},
        toggleCollapsed: () => {},
      });
      return { model };
    }
    window.bankPeriodPreview = {
      renderMatrix(width, theme, view = "both", onlyIds = null) {
        document.body.className = "theme-" + theme;
        const root = document.getElementById("preview-root");
        root.innerHTML = "";
        root.style.width = width + "px";
        const measurements = [];
        for (const entry of cases) {
          if (Array.isArray(onlyIds) && !onlyIds.includes(entry.id)) continue;
          const wrap = document.createElement("section");
          wrap.className = "preview-case";
          wrap.id = "case-" + entry.id;
          const heading = document.createElement("h2");
          heading.className = "preview-case-title";
          heading.textContent = entry.title;
          wrap.appendChild(heading);
          const note = document.createElement("div");
          note.className = "preview-note";
          const host = document.createElement("div");
          host.className = "preview-strip bob-bank-period-host";
          note.appendChild(host);
          wrap.appendChild(note);
          root.appendChild(wrap);
          const { model } = paintCase(host, entry, view);
          const rect = host.getBoundingClientRect();
          const panel = host.querySelector(".bob-bank-period");
          const notCounted = host.querySelector(".bob-bank-period-notcounted");
          const panelHeight = panel ? panel.getBoundingClientRect().height : 0;
          const notCountedHeight = notCounted ? notCounted.getBoundingClientRect().height : 0;
          const axisColumns = Array.from(host.querySelectorAll(".bob-bank-period-column"));
          const overlap = axisColumns.some((column) => {
            const caption = column.querySelector(".bob-bank-period-column-caption");
            const dot = column.querySelector(".bob-bank-period-waiting-dot");
            if (!caption || !dot || !caption.textContent) return false;
            return caption.getBoundingClientRect().bottom > dot.getBoundingClientRect().top + 0.5;
          });
          measurements.push({
            state: entry.id,
            view,
            panelHeight: Math.ceil(panelHeight),
            bodyHeight: Math.ceil(panelHeight - notCountedHeight),
            noOverflow: host.scrollWidth <= host.clientWidth + 1 && (!panel || panel.scrollWidth <= panel.clientWidth + 1),
            overlap,
            hasModel: Boolean(model && model.state === "charts"),
          });
        }
        return { measurements };
      },
    };
    window.__bankPeriodStage = "ready";
  })();
  </script>
</body>
</html>
