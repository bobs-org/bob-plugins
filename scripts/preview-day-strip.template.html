<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Bob Day strip preview matrix</title>
  <style>
    :root { color-scheme: light; }
    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; }
    body { font: 16px/1.45 system-ui, sans-serif; padding: 0 0 24px; }
    body.theme-light {
      color-scheme: light; --background-primary: #fff; --background-secondary: #f6f5f2;
      --background-modifier-border: #d8d5cf; --background-modifier-hover: #eeece8;
      --interactive-normal: #e8e6e2; --input-shadow: inset 0 0 0 1px #d8d5cf;
      --text-normal: #262521; --text-muted: #6f6c65; --text-faint: #a7a39b;
      --text-accent: #5143ad; --interactive-accent: #6556c8;
      --radius-s: 4px; --font-interface: system-ui, sans-serif;
      --color-red: #e93147; --color-orange: #ec7500; --color-yellow: #e0ac00; --color-green: #08b94e;
      --bob-area-blue: #3979c5; --bob-area-orange: #d66d36; --bob-area-aqua: #268d97;
      --bob-area-yellow: #ae8c1e; --bob-area-magenta: #b04c85; --bob-area-green: #4c8b57;
      --bob-area-violet: #765eb8; --bob-area-red: #bf5c54;
      --bob-hue-blue: var(--bob-area-blue); --bob-hue-orange: var(--bob-area-orange); --bob-hue-aqua: var(--bob-area-aqua);
      --bob-hue-yellow: var(--bob-area-yellow); --bob-hue-magenta: var(--bob-area-magenta); --bob-hue-green: var(--bob-area-green);
      --bob-hue-violet: var(--bob-area-violet); --bob-hue-red: var(--bob-area-red);
      background: #eeece8; color: var(--text-normal);
    }
    body.theme-dark {
      color-scheme: dark; --background-primary: #202124; --background-secondary: #292a2e;
      --background-modifier-border: #45464c; --background-modifier-hover: #34363b;
      --interactive-normal: #2e2f34; --input-shadow: inset 0 0 0 1px #45464c;
      --text-normal: #e7e6e2; --text-muted: #a4a3a0; --text-faint: #74757a;
      --text-accent: #b2a9ff; --interactive-accent: #9a8cf0;
      --radius-s: 4px; --font-interface: system-ui, sans-serif;
      --color-red: #fb464c; --color-orange: #e9973f; --color-yellow: #e0de71; --color-green: #44cf6e;
      --bob-area-blue: #68a4ee; --bob-area-orange: #e17a4a; --bob-area-aqua: #55b8c3;
      --bob-area-yellow: #d0b24c; --bob-area-magenta: #d172a7; --bob-area-green: #75b87e;
      --bob-area-violet: #a18ce4; --bob-area-red: #df817a;
      --bob-hue-blue: var(--bob-area-blue); --bob-hue-orange: var(--bob-area-orange); --bob-hue-aqua: var(--bob-area-aqua);
      --bob-hue-yellow: var(--bob-area-yellow); --bob-hue-magenta: var(--bob-area-magenta); --bob-hue-green: var(--bob-area-green);
      --bob-hue-violet: var(--bob-area-violet); --bob-hue-red: var(--bob-area-red);
      background: #17181a; color: var(--text-normal);
    }
    #preview-root { margin: 0 auto; width: 100%; padding: 12px; }
    .preview-heading { margin: 0 0 16px; font-size: 20px; }
    .preview-case { min-width: 0; margin: 0 0 18px; }
    .preview-case-title { margin: 0 0 5px; color: var(--text-muted); font-size: 12px; font-weight: 650; }
    .preview-note {
      min-width: 0; width: 100%; padding: 8px 12px 8px;
      border: 1px solid var(--background-modifier-border); border-radius: 6px;
      background: var(--background-primary); color: var(--text-normal);
      font: 16px/1.45 var(--font-interface);
    }
    .preview-ledger-line { min-height: 1.45em; }
    .preview-ledger-heading { color: var(--text-normal); font-weight: 650; font-size: 1.25em; }
    .preview-ledger-muted { color: var(--text-muted); }
    .preview-strip { width: 100%; min-width: 0; }
    .preview-report { margin-top: 16px; color: var(--text-muted); font-size: 12px; }
  </style>
  <style id="obsidian-baseline">__OBSIDIAN_BASELINE_CSS__</style>
  <style id="production-day-strip-css">__PRODUCTION_CSS__</style>
</head>
<body class="theme-light">
  <main id="preview-root"></main>
  <script>
  window.__previewError = "";
  window.__dayStripStage = "script-start";
  window.addEventListener("error", (event) => { window.__previewError = String(event.message || event.error || "script error"); });
  window.addEventListener("unhandledrejection", (event) => { window.__previewError = String(event.reason || "promise rejection"); });
  (() => {
    "use strict";
    const pluginSource = __PLUGIN_SOURCE_JSON__;
    const fixtureReports = __FIXTURES_JSON__;
    const moduleObject = { exports: {} };
    const modules = {
      obsidian: { Plugin: class {}, MarkdownRenderChild: class {}, MarkdownView: class {}, Notice: class {}, Platform: { isDesktopApp: false }, normalizePath: (value) => value, parseYaml: () => ({}) },
      "@codemirror/state": { Prec: { highest: (value) => value }, StateEffect: { define: () => ({}) }, RangeSetBuilder: class {} },
      "@codemirror/view": { EditorView: { updateListener: { of: (fn) => ({ fn }) } }, keymap: { of: (value) => value } },
      "@codemirror/language": { syntaxTree: null },
    };
    new Function("require", "module", "exports", "process", pluginSource)(
      (name) => modules[name] || {}, moduleObject, moduleObject.exports, { env: { HOME: "/" } },
    );
    window.__dayStripStage = "plugin-loaded";
    const helpers = moduleObject.exports.helpers;
    window.__dayStripStage = "helpers-loaded";
    const baseCases = [
      { id: "today", title: "Today in progress · 14:50", fixture: "today" },
      { id: "past", title: "Complete past day", fixture: "past" },
      { id: "skeleton", title: "First load · skeleton", fixture: null },
      { id: "stale", title: "Refresh failed · cached frame", fixture: "today", stale: true },
      { id: "unavailable", title: "No cached report · unavailable", fixture: null, error: { code: "timeout", title: "bob stats timed out", hint: "Retry once." } },
      { id: "no-pomodoros", title: "No Pomodoros", fixture: "noPomodoros" },
      { id: "not-tracked-warning", title: "Not tracked · journal warning", fixture: "notTrackedWarning" },
      { id: "many-areas", title: "Many areas · +N", fixture: "manyAreas" },
      { id: "area-only", title: "Old bob · areas without root_parent", fixture: "areaOnly" },
      { id: "same-hue-roots", title: "Same-area roots get distinct hues", fixture: "sameHueRoots" },
      { id: "many-roots", title: "Seven roots · +N", fixture: "manyRoots" },
      { id: "screenshot-day", title: "Four roots · fits at 540 and 700", fixture: "screenshotDay" },
      { id: "theme-collision", title: "Same-hue themes get shades", fixture: "themeCollision" },
      { id: "many-themes", title: "Seven themes and unnamed · +N", fixture: "manyThemes" },
      { id: "no-theme-hues", title: "Theme parts without theme_hues", fixture: "noThemeHues" },
      { id: "redefined-worked", title: "Redefined worked · no area mix", fixture: "redefinedWorked" },
      { id: "long-labels", title: "Long labels", fixture: "longLabels", relaxed: true },
      { id: "wide-values", title: "Wide values · 10h 05m", fixture: "wideValues" },
      { id: "short-history", title: "Short typical history", fixture: "shortHistory" },
      { id: "missing-day", title: "D missing · blank typical", fixture: "missingWarning" },
      { id: "old-bob", title: "Old bob without typical", fixture: "oldBob" },
      { id: "met", title: "Closed-out past day · met", fixture: "metPast" },
      { id: "hover", title: "Forced hover on a fact", fixture: "today", pseudo: "hover" },
      { id: "focus", title: "Forced focus-visible on a fact", fixture: "today", pseudo: "focus-visible" },
    ];
    const viewAxis = ["today", "past", "screenshot-day", "theme-collision", "no-pomodoros", "no-theme-hues", "skeleton", "stale"];
    const cases = [];
    for (const base of baseCases) {
      cases.push({ ...base, view: "both" });
    }
    for (const baseId of viewAxis) {
      const base = baseCases.find((item) => item.id === baseId);
      if (!base) continue;
      for (const view of ["roots", "themes"]) {
        cases.push({ ...base, id: base.id + "-" + view, title: base.title + " · " + view + " only", view });
      }
    }

    function mockBadges(doc) {
      const plan = doc.createElement("div");
      plan.className = "bob-plan";
      const chips = [
        ["bob-plan-chip bob-plan-plan", "TODAY 3/3 · 7/10"],
        ["bob-plan-chip bob-plan-pending", "PENDING 4/10"],
        ["bob-plan-chip bob-plan-next", "NEXT 15/15"],
        ["bob-plan-chip bob-plan-ready", "READY 61/100"],
      ];
      for (const [cls, text] of chips) {
        const chip = doc.createElement("a");
        chip.className = cls;
        chip.textContent = text;
        plan.appendChild(chip);
      }
      const themes = doc.createElement("span");
      themes.className = "bob-plan-themes";
      const star = doc.createElement("span");
      star.className = "bob-plan-themes-star";
      star.textContent = "★ ";
      themes.appendChild(star);
      const names = doc.createElement("span");
      names.textContent = "GTD · BOB";
      themes.appendChild(names);
      plan.appendChild(themes);
      return plan;
    }

    function livePreviewCell(doc, stripHost) {
      const view = doc.createElement("div");
      view.className = "markdown-source-view mod-cm6";
      const content = doc.createElement("div");
      content.className = "cm-content";
      const codeBlock = doc.createElement("div");
      codeBlock.className = "cm-preview-code-block cm-embed-block markdown-rendered";
      const block = doc.createElement("div");
      block.className = "block-language-bob-plan bob-plan-has-day-strip";
      block.appendChild(stripHost);
      block.appendChild(mockBadges(doc));
      codeBlock.appendChild(block);
      content.appendChild(codeBlock);
      const heading = doc.createElement("div");
      heading.className = "preview-ledger-line preview-ledger-heading";
      heading.textContent = "## Pomodoros";
      content.appendChild(heading);
      const lineA = doc.createElement("div");
      lineA.className = "preview-ledger-line";
      lineA.textContent = "- [08:00-08:45] Design the day strip";
      content.appendChild(lineA);
      const lineB = doc.createElement("div");
      lineB.className = "preview-ledger-line preview-ledger-muted";
      lineB.textContent = "- [09:00-09:25] Review notes and close the loop";
      content.appendChild(lineB);
      view.appendChild(content);
      return view;
    }

    function readingViewCell(doc, stripHost) {
      const view = doc.createElement("div");
      view.className = "markdown-preview-view markdown-rendered";
      const block = doc.createElement("div");
      block.className = "block-language-bob-plan bob-plan-has-day-strip";
      block.appendChild(stripHost);
      block.appendChild(mockBadges(doc));
      view.appendChild(block);
      const heading = doc.createElement("h2");
      heading.textContent = "Pomodoros";
      view.appendChild(heading);
      return view;
    }

    function boxesOverlap(a, b, tolerance) {
      const width = Math.min(a.right, b.right) - Math.max(a.left, b.left);
      const height = Math.min(a.bottom, b.bottom) - Math.max(a.top, b.top);
      return width > tolerance && height > tolerance;
    }

    function visibleBox(node) {
      const box = node.getBoundingClientRect();
      if (box.width <= 0 || box.height <= 0) return null;
      return box;
    }

    function measureStrip(strip) {
      const rect = strip.getBoundingClientRect();
      const descendants = Array.from(strip.querySelectorAll("*"));
      let maxOverflow = 0;
      for (const node of descendants) {
        const box = node.getBoundingClientRect();
        if (box.width === 0 && box.height === 0) continue;
        const over = Math.max(
          0,
          rect.left - box.left,
          box.right - rect.right,
          rect.top - box.top,
          box.bottom - rect.bottom,
        );
        if (over > maxOverflow) maxOverflow = over;
      }
      const facts = Array.from(strip.querySelectorAll(".bob-day-strip-fact"));
      const factBoxes = facts.map((node) => node.getBoundingClientRect());
      // Cluster into wrapped rows by top (2 px bands): stat cells sit in
      // their own grid tracks, so adjacent cells may touch but must not
      // overlap. Only same-row pairs can collide.
      const insetX = 0;
      const insetY = 0;
      const contentBoxes = factBoxes.map((box) => ({
        left: box.left + insetX,
        right: box.right - insetX,
        top: box.top + insetY,
        bottom: box.bottom - insetY,
      }));
      const rowOf = factBoxes.map((box) => {
        const bands = [];
        for (const [index, other] of factBoxes.entries()) {
          if (Math.abs(other.top - box.top) <= 2) bands.push(index);
        }
        return Math.min(...bands);
      });
      let maxFactOverlap = 0;
      for (let i = 0; i < contentBoxes.length; i += 1) {
        for (let j = i + 1; j < contentBoxes.length; j += 1) {
          if (rowOf[i] !== rowOf[j]) continue;
          const a = contentBoxes[i];
          const b = contentBoxes[j];
          const width = Math.min(a.right, b.right) - Math.max(a.left, b.left);
          const height = Math.min(a.bottom, b.bottom) - Math.max(a.top, b.top);
          if (width > 0.5 && height > 0.5) maxFactOverlap = Math.max(maxFactOverlap, Math.min(width, height));
        }
      }
      const factTops = Array.from(new Set(factBoxes.map((box) => Math.round(box.top)))).sort((a, b) => a - b);
      let valueBaselineSpread = 0;
      for (const top of factTops) {
        const bottoms = [];
        for (const fact of facts) {
          if (Math.round(fact.getBoundingClientRect().top) !== top) continue;
          const value = fact.querySelector(".bob-day-strip-value");
          if (value) bottoms.push(value.getBoundingClientRect().bottom);
        }
        if (bottoms.length > 1) valueBaselineSpread = Math.max(valueBaselineSpread, Math.max(...bottoms) - Math.min(...bottoms));
      }
      const line1 = strip.querySelector(".bob-day-strip-facts");
      const line2 = strip.querySelector(".bob-day-strip-mix-row");
      let linesOverlap = 0;
      if (line1 && line2) {
        const a = line1.getBoundingClientRect();
        const b = line2.getBoundingClientRect();
        if (a.width > 0 && a.height > 0 && b.width > 0 && b.height > 0 && boxesOverlap(a, b, 0.5)) {
          linesOverlap = Math.min(
            Math.min(a.right, b.right) - Math.max(a.left, b.left),
            Math.min(a.bottom, b.bottom) - Math.max(a.top, b.top),
          );
        }
      }
      let legendOverlap = 0;
      const legend = strip.querySelector(".bob-day-strip-legend");
      const meta = strip.querySelector(".bob-day-strip-meta");
      if (legend) {
        const items = Array.from(legend.children).map(visibleBox).filter(Boolean);
        for (let i = 0; i < items.length; i += 1) {
          for (let j = i + 1; j < items.length; j += 1) {
            if (boxesOverlap(items[i], items[j], 0.5)) legendOverlap = Math.max(legendOverlap, 1);
          }
        }
        if (meta) {
          const metaBox = visibleBox(meta);
          if (metaBox) {
            for (const item of items) {
              if (boxesOverlap(item, metaBox, 0.5)) legendOverlap = Math.max(legendOverlap, 1);
            }
          }
        }
      }
      const factWidths = factBoxes.map((box) => Math.round(box.width * 10) / 10);
      return {
        stripHeight: Math.round(rect.height * 10) / 10,
        maxOverflow: Math.round(maxOverflow * 10) / 10,
        factWidths,
        factRows: factTops.length,
        valueBaselineSpread: Math.round(valueBaselineSpread * 10) / 10,
        maxFactOverlap: Math.round(maxFactOverlap * 10) / 10,
        linesOverlap: Math.round(linesOverlap * 10) / 10,
        legendOverlap: Math.round(legendOverlap * 10) / 10,
        hasButton: Boolean(strip.querySelector("button")),
        ...measureStripPlacement(strip),
        ...measureStripHues(strip),
        ...measureThemeLanes(strip),
        ...measureStripStats(strip, factBoxes, rowOf),
        ...measureStripMarks(strip),
        ...measureStripRefs(strip),
      };
    }

    // (r) Geometry of boolean status marks; (s) ready inks vs stale muted ink.
    function measureStripMarks(strip) {
      const out = {
        markGeometryFailures: [],
        markInk: null,
        markState: null,
        markMutedMatch: null,
      };
      try {
        const head = strip.querySelector(".bob-day-strip-head");
        const mutedColor = head ? getComputedStyle(head).color : "";
        for (const value of strip.querySelectorAll(".bob-day-strip-value-mark")) {
          const svg = value.querySelector("svg.bob-day-strip-mark");
          if (!svg) continue;
          const valueBox = value.getBoundingClientRect();
          const markBox = svg.getBoundingClientRect();
          const fontSize = parseFloat(getComputedStyle(value).fontSize) || 0;
          if (Math.abs(markBox.width - markBox.height) > 0.5) {
            out.markGeometryFailures.push(`not square ${Math.round(markBox.width * 10) / 10}x${Math.round(markBox.height * 10) / 10}`);
          }
          if (fontSize > 0) {
            const ratio = markBox.width / fontSize;
            if (ratio < 0.95 || ratio > 1.12) {
              out.markGeometryFailures.push(`size ${Math.round(ratio * 100) / 100}x font`);
            }
          }
          if (
            markBox.left < valueBox.left - 0.5
            || markBox.right > valueBox.right + 0.5
            || markBox.top < valueBox.top - 0.5
            || markBox.bottom > valueBox.bottom + 0.5
          ) {
            out.markGeometryFailures.push("outside its value box");
          }
          const markCenter = (markBox.top + markBox.bottom) / 2;
          const valueCenter = (valueBox.top + valueBox.bottom) / 2;
          if (Math.abs(markCenter - valueCenter) > 1) {
            out.markGeometryFailures.push(`vertical centre ${Math.round(Math.abs(markCenter - valueCenter) * 10) / 10}px off`);
          }
          const inkNode = svg.querySelector(".bob-day-strip-mark-rim, .bob-day-strip-mark-ring");
          if (inkNode) {
            out.markInk = getComputedStyle(inkNode).stroke;
            out.markState = value.getAttribute("data-mark");
            out.markMutedMatch = Boolean(mutedColor) && Boolean(out.markInk) && out.markInk === mutedColor;
          }
        }
      } catch (error) {
        // Mark measurement never breaks the matrix.
      }
      return out;
    }

    function parseCssRgb(value) {
      const match = /rgba?\(\s*([0-9.]+)\s*,\s*([0-9.]+)\s*,\s*([0-9.]+)/i.exec(String(value || ""));
      if (!match) return null;
      return [Number(match[1]), Number(match[2]), Number(match[3])];
    }

    function relativeLuminance(rgb) {
      const channel = (value) => {
        const c = Number(value) / 255;
        return c <= 0.04045 ? c / 12.92 : Math.pow((c + 0.055) / 1.055, 2.4);
      };
      return 0.2126 * channel(rgb[0]) + 0.7152 * channel(rgb[1]) + 0.0722 * channel(rgb[2]);
    }

    function contrastRatio(fg, bg) {
      const a = relativeLuminance(fg);
      const b = relativeLuminance(bg);
      const hi = Math.max(a, b);
      const lo = Math.min(a, b);
      return (hi + 0.05) / (lo + 0.05);
    }

    function measureStripRefs(strip) {
      const out = {
        refCount: 0,
        factCount: 0,
        refHidden: true,
        refBaselineSpread: 0,
        refClip: 0,
        refMarkFailures: [],
        refContrast: null,
      };
      try {
        const facts = Array.from(strip.querySelectorAll(".bob-day-strip-fact"));
        const refs = Array.from(strip.querySelectorAll(".bob-day-strip-ref"));
        out.factCount = facts.length;
        out.refCount = refs.length;
        out.refHidden = refs.length === 0 || refs.every((node) => node.getAttribute("aria-hidden") === "true");
        const rowTops = [];
        for (const fact of facts) {
          const ref = fact.querySelector(".bob-day-strip-ref");
          if (!ref) continue;
          if (fact.scrollWidth > fact.clientWidth + 0.5) {
            out.refClip = Math.max(out.refClip, fact.scrollWidth - fact.clientWidth);
          }
          const refBox = ref.getBoundingClientRect();
          if (refBox.width > 0 && refBox.height > 0) {
            const band = Math.round(refBox.top);
            let row = rowTops.find((entry) => Math.abs(entry.top - band) <= 2);
            if (!row) {
              row = { top: band, bottoms: [] };
              rowTops.push(row);
            }
            row.bottoms.push(refBox.bottom);
          }
          const mark = ref.querySelector("svg.bob-day-strip-ref-mark");
          const num = ref.querySelector(".bob-day-strip-ref-num");
          if (mark) {
            const markBox = mark.getBoundingClientRect();
            const lineBox = ref.getBoundingClientRect();
            if (Math.abs(markBox.width - markBox.height) > 0.5) {
              out.refMarkFailures.push(`not square ${Math.round(markBox.width * 10) / 10}x${Math.round(markBox.height * 10) / 10}`);
            }
            if (
              markBox.left < lineBox.left - 0.5
              || markBox.right > lineBox.right + 0.5
              || markBox.top < lineBox.top - 0.5
              || markBox.bottom > lineBox.bottom + 0.5
            ) {
              out.refMarkFailures.push("outside its line");
            }
            if (num) {
              const numBox = num.getBoundingClientRect();
              const markCenter = (markBox.top + markBox.bottom) / 2;
              const numCenter = (numBox.top + numBox.bottom) / 2;
              if (Math.abs(markCenter - numCenter) > 1) {
                out.refMarkFailures.push(`vertical centre ${Math.round(Math.abs(markCenter - numCenter) * 10) / 10}px off`);
              }
            }
          }
        }
        for (const row of rowTops) {
          if (row.bottoms.length > 1) {
            out.refBaselineSpread = Math.max(out.refBaselineSpread, Math.max(...row.bottoms) - Math.min(...row.bottoms));
          }
        }
        const sample = refs.find((node) => (node.getAttribute("data-ref-state") === "ready" || node.getAttribute("data-ref-state") === "short")) || refs[0];
        if (sample) {
          const fg = parseCssRgb(getComputedStyle(sample).color);
          let bgNode = strip;
          let bg = parseCssRgb(getComputedStyle(bgNode).backgroundColor);
          while (bgNode && (!bg || (bg[0] === 0 && bg[1] === 0 && bg[2] === 0 && String(getComputedStyle(bgNode).backgroundColor).includes("0)")))) {
            bgNode = bgNode.parentElement;
            if (!bgNode) break;
            bg = parseCssRgb(getComputedStyle(bgNode).backgroundColor);
          }
          if (fg && bg) out.refContrast = Math.round(contrastRatio(fg, bg) * 100) / 100;
        }
      } catch (error) {
        // Reference measurement never breaks the matrix.
      }
      return out;
    }

    // (n) the values lead: each value is at least 2x its head; (o) every
    // fact's aria-label starts with its label and display; ready/short refs
    // add bob's words; no value holds a warning;
    // (p) row-start hairlines hide while later cells draw theirs;
    // (q) the empty track shows in the no-Pomodoros cell.
    function measureStripStats(strip, factBoxes, rowOf) {
      const out = {
        valueLeadMinRatio: null,
        ariaFaithful: true,
        valueHasWarning: false,
        rowStartHairlines: [],
        laterHairlines: [],
        barBackground: "",
      };
      try {
        const facts = Array.from(strip.querySelectorAll(".bob-day-strip-fact"));
        const ratios = [];
        for (const fact of facts) {
          const head = fact.querySelector(".bob-day-strip-head");
          const value = fact.querySelector(".bob-day-strip-value");
          const metricLabel = fact.querySelector(".bob-day-strip-label");
          if (head && value) {
            const headSize = parseFloat(getComputedStyle(head).fontSize) || 0;
            const valueSize = parseFloat(getComputedStyle(value).fontSize) || 0;
            if (headSize > 0) ratios.push(valueSize / headSize);
          }
          const label = fact.getAttribute("aria-label") || "";
          const text = value ? value.textContent || "" : "";
          const name = metricLabel ? metricLabel.textContent || "" : "";
          if (name && text && !label.startsWith(name + " " + text) && !label.startsWith(name + ", loading")) {
            out.ariaFaithful = false;
          }
          const ref = fact.querySelector(".bob-day-strip-ref");
          const refState = ref ? ref.getAttribute("data-ref-state") : "";
          if ((refState === "ready" || refState === "short") && label.indexOf(", ") < 0) {
            out.ariaFaithful = false;
          }
          if (value && value.textContent && value.textContent.includes("⚠")) out.valueHasWarning = true;
        }
        if (ratios.length) out.valueLeadMinRatio = Math.round(Math.min(...ratios) * 100) / 100;
        const rowStarts = new Set();
        for (let i = 0; i < factBoxes.length; i += 1) {
          let start = true;
          for (let j = 0; j < factBoxes.length; j += 1) {
            if (rowOf[j] !== rowOf[i]) continue;
            if (factBoxes[j].left < factBoxes[i].left - 0.5) { start = false; break; }
          }
          if (start) rowStarts.add(i);
        }
        for (let i = 0; i < facts.length; i += 1) {
          if (i === 0) continue;
          let style = null;
          try {
            style = getComputedStyle(facts[i], "::before");
          } catch (error) { style = null; }
          const record = {
            display: style ? style.display : "",
            content: style ? style.content : "",
          };
          if (rowStarts.has(i)) out.rowStartHairlines.push(record);
          else out.laterHairlines.push(record);
        }
        const bar = strip.querySelector(":scope > .bob-day-strip-bar");
        if (bar) out.barBackground = getComputedStyle(bar).backgroundColor || "";
      } catch (error) {
        // Stat measurement never breaks the matrix.
      }
      return out;
    }

    function visible(node) {
      if (!node) return false;
      const box = node.getBoundingClientRect();
      if (box.width <= 0 || box.height <= 0) return false;
      return getComputedStyle(node).display !== "none" && !node.hasAttribute("hidden");
    }

    // (m) distinct hues: bar segments carry pairwise distinct hue classes
    // and each legend dot matches its segment.
    function hueFromClass(className) {
      const match = /bob-day-strip-hue-([a-z]+)/.exec(String(className || ""));
      return match ? match[1] : null;
    }

    function measureStripHues(strip) {
      const out = { barHues: [], barTitles: [], legendDots: [] };
      try {
        const bar = strip.querySelector(':scope > .bob-day-strip-bar[data-lane="roots"]')
          || strip.querySelector(":scope > .bob-day-strip-bar:not(.bob-day-strip-bar-themes)")
          || strip.querySelector(":scope > .bob-day-strip-bar");
        if (bar) {
          for (const segment of bar.querySelectorAll(".bob-day-strip-bar-segment")) {
            if (segment.hasAttribute("hidden")) continue;
            const hue = hueFromClass(segment.getAttribute("class"));
            if (!hue) continue;
            out.barHues.push(hue);
            out.barTitles.push(segment.getAttribute("title") || "");
          }
        }
        const rootsLegend = strip.querySelector(".bob-day-strip-mix-row:not(.bob-day-strip-lane-themes) .bob-day-strip-legend")
          || strip.querySelector(".bob-day-strip-legend");
        for (const item of (rootsLegend ? rootsLegend.querySelectorAll(".bob-day-strip-legend-item") : [])) {
          if (item.hasAttribute("hidden")) continue;
          if (!visible(item)) continue;
          const dot = item.querySelector(".bob-day-strip-legend-dot");
          const hue = dot ? hueFromClass(dot.getAttribute("class")) : null;
          if (!hue) continue;
          out.legendDots.push({ title: item.getAttribute("title") || "", hue });
        }
      } catch (error) {
        // Hue measurement never breaks the matrix.
      }
      return out;
    }

    function themeHueFromClass(className) {
      const match = /bob-day-strip-theme-hue-([a-z]+)/.exec(String(className || ""));
      return match ? match[1] : null;
    }

    function measureThemeLanes(strip) {
      const out = {
        barWidthDeltas: [],
        lastBarIsLast: false,
        lanesOverlap: 0,
        laneGapOk: null,
        themeLanePresent: false,
        legendFits: [],
        themeSwatches: [],
        themeSegments: [],
      };
      try {
        const bars = Array.from(strip.querySelectorAll(":scope > .bob-day-strip-bar"));
        const stripBox = strip.getBoundingClientRect();
        const style = getComputedStyle(strip);
        const padX = (parseFloat(style.paddingLeft) || 0) + (parseFloat(style.paddingRight) || 0);
        const contentWidth = stripBox.width - padX;
        for (const bar of bars) {
          const barBox = bar.getBoundingClientRect();
          out.barWidthDeltas.push(Math.round(Math.abs(barBox.width - contentWidth) * 10) / 10);
        }
        const lastBar = bars[bars.length - 1] || null;
        if (lastBar) {
          const barBox = lastBar.getBoundingClientRect();
          out.lastBarIsLast = strip.lastElementChild === lastBar
            && barBox.bottom <= stripBox.bottom + 0.5
            && barBox.bottom >= stripBox.bottom - 0.5;
        }
        const themesBar = strip.querySelector(":scope > .bob-day-strip-bar-themes")
          || bars.find((bar) => bar.getAttribute("data-lane") === "themes")
          || null;
        out.themeLanePresent = Boolean(themesBar);
        const rootsBar = bars.find((bar) => bar.getAttribute("data-lane") === "roots") || null;
        const themesRow = strip.querySelector(".bob-day-strip-lane-themes");
        if (rootsBar && themesRow && themesBar && rootsBar !== themesBar) {
          const a = rootsBar.getBoundingClientRect();
          const b = themesRow.getBoundingClientRect();
          const c = themesBar.getBoundingClientRect();
          if (boxesOverlap(a, b, 0.5) || boxesOverlap(b, c, 0.5) || boxesOverlap(a, c, 0.5)) {
            out.lanesOverlap = 1;
          }
          out.laneGapOk = (b.top - a.bottom) > (c.top - b.bottom) + 0.05;
        }
        for (const legend of strip.querySelectorAll(".bob-day-strip-legend")) {
          const items = Array.from(legend.querySelectorAll(".bob-day-strip-legend-item"));
          const visibleItems = items.filter(visible);
          const counter = legend.querySelector(".bob-day-strip-overflow");
          let counterValue = null;
          if (counter && visible(counter)) {
            const match = /^\+(\d+)$/.exec(String(counter.textContent || "").trim());
            if (match) counterValue = Number(match[1]);
          }
          out.legendFits.push({
            total: items.length,
            visible: visibleItems.length,
            counter: counterValue,
          });
        }
        if (themesRow && themesBar) {
          for (const segment of themesBar.querySelectorAll(".bob-day-strip-bar-segment")) {
            if (segment.hasAttribute("hidden")) continue;
            const hue = themeHueFromClass(segment.getAttribute("class"));
            out.themeSegments.push({
              title: segment.getAttribute("title") || "",
              background: getComputedStyle(segment).backgroundColor || "",
              hue,
              shade: Number(segment.getAttribute("data-shade") || 0) || 0,
              gray: hue === "gray" || (segment.getAttribute("class") || "").includes("bob-day-strip-bar-bucket"),
            });
          }
          const themesLegend = themesRow.querySelector(".bob-day-strip-legend");
          for (const item of (themesLegend ? themesLegend.querySelectorAll(".bob-day-strip-legend-item") : [])) {
            if (!visible(item)) continue;
            const swatch = item.querySelector(".bob-day-strip-legend-swatch");
            if (!swatch) continue;
            const box = swatch.getBoundingClientRect();
            out.themeSwatches.push({
              title: item.getAttribute("title") || "",
              width: box.width,
              height: box.height,
              radius: parseFloat(getComputedStyle(swatch).borderRadius) || 0,
              background: getComputedStyle(swatch).backgroundColor || "",
            });
          }
        }
      } catch (error) {
        // Theme-lane measurement never breaks the matrix.
      }
      return out;
    }

    // (t)-(w) lane-switch geometry: the switch box, its marks, and the
    // painted lanes. Never breaks the matrix.
    function measureLaneSwitch(strip) {
      const out = {
        switchPresent: false,
        switchWidth: 0,
        switchHeight: 0,
        switchBox: null,
        switchView: "",
        switchInsideTopRow: null,
        switchMarks: [],
        legendDotWidth: 0,
        legendDotHeight: 0,
        laneRowCount: 0,
        laneBarCount: 0,
        laneRows: [],
        laneBars: [],
      };
      try {
        const rows = Array.from(strip.querySelectorAll(":scope > .bob-day-strip-mix-row"));
        const bars = Array.from(strip.querySelectorAll(":scope > .bob-day-strip-bar"));
        out.laneRowCount = rows.length;
        out.laneBarCount = bars.length;
        out.laneRows = rows.map((row) => row.getAttribute("data-lane") || "");
        out.laneBars = bars.map((bar) => bar.getAttribute("data-lane") || "");
        const sw = strip.querySelector(".bob-day-strip-lanes");
        if (!sw) return out;
        out.switchPresent = true;
        out.switchView = sw.getAttribute("data-view") || "";
        try {
          const box = sw.getBoundingClientRect();
          out.switchBox = { x: box.x, y: box.y, width: box.width, height: box.height };
          out.switchWidth = Math.round(box.width * 10) / 10;
          out.switchHeight = Math.round(box.height * 10) / 10;
        } catch (error) {
          // Box is best-effort.
        }
        try {
          const topRow = rows[0] || null;
          if (topRow && out.switchBox) {
            const topBox = topRow.getBoundingClientRect();
            const inside = out.switchBox.x >= topBox.x - 0.5
              && (out.switchBox.x + out.switchBox.width) <= topBox.right + 0.5
              && out.switchBox.y >= topBox.y - 0.5
              && (out.switchBox.y + out.switchBox.height) <= topBox.bottom + 0.5;
            out.switchInsideTopRow = Boolean(inside);
          }
        } catch (error) {
          // Containment is best-effort.
        }
        try {
          const dot = strip.querySelector(".bob-day-strip-legend-dot");
          if (dot) {
            const dotBox = dot.getBoundingClientRect();
            out.legendDotWidth = Math.round(dotBox.width * 10) / 10;
            out.legendDotHeight = Math.round(dotBox.height * 10) / 10;
          }
        } catch (error) {
          // Dot size is best-effort.
        }
        try {
          const marks = Array.from(sw.querySelectorAll(".bob-day-strip-lanes-mark"));
          for (const mark of marks) {
            const box = mark.getBoundingClientRect();
            const style = getComputedStyle(mark);
            out.switchMarks.push({
              lane: (mark.getAttribute("class") || "").includes("bob-day-strip-lanes-mark-roots") ? "roots" : "themes",
              width: Math.round(box.width * 10) / 10,
              height: Math.round(box.height * 10) / 10,
              radius: parseFloat(style.borderRadius) || 0,
              radiusText: style.borderRadius || "",
              background: style.backgroundColor || "",
              shadow: style.boxShadow || "",
              on: mark.getAttribute("data-on") || "",
            });
          }
        } catch (error) {
          // Marks are best-effort.
        }
      } catch (error) {
        // Switch measurement never breaks the matrix.
      }
      return out;
    }

    // (i) strip precedes .bob-plan in the DOM with a calm gap; (j) the bar
    // spans the strip and ends it; (k) legend labels never truncate;
    // (l) narrow cells show at most two legend labels plus a true counter.
    function measureStripPlacement(strip) {
      const out = {
        domOrderOk: false,
        stripToBadges: null,
        barWidthDelta: null,
        barIsLast: false,
        legendTruncation: 0,
        legendItemOverflow: 0,
        visibleLegend: 0,
        visibleCounter: null,
      };
      try {
        const block = strip.parentElement;
        const plan = block ? block.querySelector(":scope > .bob-plan") : null;
        const kids = block ? Array.from(block.children) : [];
        out.domOrderOk = Boolean(plan) && kids[0] === strip && kids[1] === plan;
        if (plan) {
          const stripBox = strip.getBoundingClientRect();
          const planBox = plan.getBoundingClientRect();
          if (stripBox.height > 0 && planBox.height > 0) {
            out.stripToBadges = Math.round((planBox.top - stripBox.bottom) * 10) / 10;
          }
        }
        const bars = Array.from(strip.querySelectorAll(":scope > .bob-day-strip-bar"));
        const lastBar = bars[bars.length - 1] || null;
        if (lastBar) {
          const stripBox = strip.getBoundingClientRect();
          const barBox = lastBar.getBoundingClientRect();
          const style = getComputedStyle(strip);
          const padX = (parseFloat(style.paddingLeft) || 0) + (parseFloat(style.paddingRight) || 0);
          out.barWidthDelta = Math.round(Math.abs(barBox.width - (stripBox.width - padX)) * 10) / 10;
          const last = strip.lastElementChild;
          out.barIsLast = last === lastBar && barBox.bottom <= stripBox.bottom + 0.5 && barBox.bottom >= stripBox.bottom - 0.5;
        }
        let worst = 0;
        for (const label of strip.querySelectorAll(".bob-day-strip-legend-label")) {
          if (!visible(label)) continue;
          worst = Math.max(worst, label.scrollWidth - label.clientWidth);
        }
        out.legendTruncation = Math.round(worst * 10) / 10;
        // A shrunken legend item keeps its nowrap text visible past its box,
        // so it paints over the next item while no two boxes intersect. The
        // item's own scrollWidth catches that: it exceeds the box exactly
        // when content spills out of it.
        let worstItem = 0;
        for (const item of strip.querySelectorAll(".bob-day-strip-legend-item")) {
          if (!visible(item)) continue;
          // Skeleton placeholders are invisible by design; their shrunken
          // boxes never paint over anything.
          try {
            if (getComputedStyle(item).visibility === "hidden") continue;
          } catch (error) {
            // Fall through to the measurement.
          }
          worstItem = Math.max(worstItem, item.scrollWidth - item.clientWidth);
        }
        out.legendItemOverflow = Math.round(worstItem * 10) / 10;
        const rootsLegend = strip.querySelector(".bob-day-strip-mix-row:not(.bob-day-strip-lane-themes) .bob-day-strip-legend")
          || strip.querySelector(".bob-day-strip-legend");
        out.visibleLegend = rootsLegend
          ? Array.from(rootsLegend.querySelectorAll(".bob-day-strip-legend-item")).filter(visible).length
          : 0;
        const rootsCounter = rootsLegend ? rootsLegend.querySelector(".bob-day-strip-overflow") : null;
        if (rootsCounter && visible(rootsCounter)) {
          const match = /^\+(\d+)$/.exec(String(rootsCounter.textContent || "").trim());
          if (match) out.visibleCounter = Number(match[1]);
        }
      } catch (error) {
        // Placement measurement never breaks the matrix.
      }
      return out;
    }

    function renderMatrix(width, theme) {
      document.body.className = `theme-${theme}`;
      const root = document.querySelector("#preview-root");
      root.replaceChildren();
      root.style.width = `${width}px`;
      const heading = document.createElement("h1");
      heading.className = "preview-heading";
      heading.textContent = `Day strip · ${width}px · ${theme}`;
      root.appendChild(heading);
      const measurements = [];
      for (const item of cases) {
        const card = document.createElement("section");
        card.className = "preview-case";
        card.setAttribute("data-case", item.id);
        const title = document.createElement("h2");
        title.className = "preview-case-title";
        title.textContent = item.title;
        card.appendChild(title);
        const note = document.createElement("div");
        note.className = "preview-note";
        const strip = document.createElement("div");
        strip.className = "preview-strip";
        strip.setAttribute("data-strip", item.id);
        note.appendChild(livePreviewCell(document, strip));
        card.appendChild(note);
        root.appendChild(card);

        const fixture = item.fixture ? fixtureReports[item.fixture] : null;
        const laneView = item.view || "both";
        const context = fixture
          ? { localToday: fixture.localToday, fetchedAt: fixture.fetchedAt, stale: item.stale === true, error: item.stale ? { code: "timeout", title: "bob stats timed out" } : null, laneView }
          : { localToday: "2026-10-24", error: item.error || null, laneView };
        const model = helpers.dayStripModel(fixture && fixture.report, fixture ? fixture.day : "2026-10-24", context);
        helpers.paintDayStrip(strip, model, { openStats() {}, retry() {} });
        const mixOmitted = Boolean(!model || !model.mix || model.mix.omitted);
        const segments = !mixOmitted && model && model.mix && Array.isArray(model.mix.segments) ? model.mix.segments.length : 0;
        const themeOmitted = Boolean(!model || !model.themes || model.themes.omitted);
        const themeSegmentsCount = !themeOmitted && model.themes && Array.isArray(model.themes.segments) ? model.themes.segments.length : 0;
        const laneViewActual = (model && model.lanes && model.lanes.view) || laneView;
        const laneShown = (model && model.lanes && Array.isArray(model.lanes.shown)) ? model.lanes.shown.slice() : [];
        measurements.push({ state: item.id, view: laneView, laneView: laneViewActual, laneShown, relaxed: item.relaxed === true, segments, mixOmitted, themeOmitted, themeSegmentsCount, ...measureStrip(strip), ...measureLaneSwitch(strip) });
      }
      const readingCard = document.createElement("section");
      readingCard.className = "preview-case";
      readingCard.setAttribute("data-case", "reading");
      const readingTitle = document.createElement("h2");
      readingTitle.className = "preview-case-title";
      readingTitle.textContent = "Reading view · today in progress";
      readingCard.appendChild(readingTitle);
      const readingNote = document.createElement("div");
      readingNote.className = "preview-note";
      const readingStrip = document.createElement("div");
      readingStrip.className = "preview-strip";
      readingStrip.setAttribute("data-strip", "reading");
      readingNote.appendChild(readingViewCell(document, readingStrip));
      readingCard.appendChild(readingNote);
      root.appendChild(readingCard);
      const fixture = fixtureReports.today;
      const readingModel = helpers.dayStripModel(fixture.report, fixture.day, { localToday: fixture.localToday, fetchedAt: fixture.fetchedAt, laneView: "both" });
      helpers.paintDayStrip(readingStrip, readingModel, { openStats() {}, retry() {} });
      const readingOmitted = Boolean(!readingModel || !readingModel.mix || readingModel.mix.omitted);
      const readingSegments = !readingOmitted && readingModel && readingModel.mix && Array.isArray(readingModel.mix.segments) ? readingModel.mix.segments.length : 0;
      const readingThemeOmitted = Boolean(!readingModel || !readingModel.themes || readingModel.themes.omitted);
      const readingThemeSegments = !readingThemeOmitted && readingModel.themes && Array.isArray(readingModel.themes.segments) ? readingModel.themes.segments.length : 0;
      measurements.push({ state: "reading", view: "both", laneView: "both", laneShown: (readingModel.lanes && readingModel.lanes.shown) || [], relaxed: false, segments: readingSegments, mixOmitted: readingOmitted, themeOmitted: readingThemeOmitted, themeSegmentsCount: readingThemeSegments, ...measureStrip(readingStrip), ...measureLaneSwitch(readingStrip) });
      return { width, theme, measurements, pageScrollWidth: document.documentElement.scrollWidth, viewportWidth: window.innerWidth };
    }
    window.dayStripPreview = { renderMatrix, cases };
    window.__dayStripStage = "ready";
    window.__dayStripPreviewReady = true;
  })();
  </script>
</body>
