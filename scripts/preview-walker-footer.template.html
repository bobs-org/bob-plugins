    function visible(node) {
      return Boolean(node)

    function rgb(text) {
      const value = String(text);
      const oklch = /oklch\(\s*([\d.]+)\s+([\d.]+)\s+([\d.]+)/.exec(value);
      if (oklch) {
        const lightness = Number(oklch[1]);
        const chroma = Number(oklch[2]);
        const hue = Number(oklch[3]) * Math.PI / 180;
        const a = chroma * Math.cos(hue);
        const b = chroma * Math.sin(hue);
        const l = (lightness + 0.3963377774 * a + 0.2158037573 * b) ** 3;
        const m = (lightness - 0.1055613458 * a - 0.0638541728 * b) ** 3;
        const s = (lightness - 0.0894841775 * a - 1.291485548 * b) ** 3;

          4.0767416621 * l - 3.3077115913 * m + 0.2309699292 * s,
          -1.2684380046 * l + 2.6097574011 * m - 0.3413193965 * s,
          -0.0041960863 * l - 0.7034186147 * m + 1.707614701 * s,
        ];
        return linear.map((channel) => {
          const clamped = Math.max(0, Math.min(1, channel));
          const encoded = clamped <= 0.0031308
            ? 12.92 * clamped
            : 1.055 * clamped ** (1 / 2.4) - 0.055;
          return encoded * 255;
        });
      }
      const values = value.match(/[\d.]+/g);
      return values && values.length >= 3 ? values.slice(0, 3).map(Number) : null;
    }
    function luminance(color) {
      const channels = rgb(color);
      if (!channels) return null;
      const linear = channels.map((value) => {
        const component = value / 255;
        return component <= 0.04045 ? component / 12.92 : ((component + 0.055) / 1.055) ** 2.4;
      });
      return 0.2126 * linear[0] + 0.7152 * linear[1] + 0.0722 * linear[2];
    }
    function contrast(foreground, background) {
      const a = luminance(foreground);
      const b = luminance(background);
      if (a === null || b === null) return null;
      return Math.round(((Math.max(a, b) + 0.05) / (Math.min(a, b) + 0.05)) * 100) / 100;
    }
    function resolvedChannels(colorText) {
      try {
        const canvas = document.createElement("canvas");
        canvas.width = 1;
        canvas.height = 1;
        const ctx = canvas.getContext("2d", { willReadFrequently: true });
        if (!ctx) return rgb(colorText);
        ctx.fillStyle = String(colorText);
        ctx.fillRect(0, 0, 1, 1);
        const data = ctx.getImageData(0, 0, 1, 1).data;
        return [data[0], data[1], data[2]];
      } catch (error) {
        return rgb(colorText);
      }
    }
    function resolvedContrast(foregroundText, backgroundText) {
      const foreground = resolvedChannels(foregroundText);
      const background = resolvedChannels(backgroundText);
      if (!foreground || !background) return null;
      const linear = (channels) => channels.map((value) => {
        const component = value / 255;
        return component <= 0.04045 ? component / 12.92 : ((component + 0.055) / 1.055) ** 2.4;
      });
      const lum = (channels) => {
        const [r, g, b] = linear(channels);
        return 0.2126 * r + 0.7152 * g + 0.0722 * b;
      };
      const a = lum(foreground);
      const b = lum(background);
      return Math.round(((Math.max(a, b) + 0.05) / (Math.min(a, b) + 0.05)) * 100) / 100;
    }
    function chipText(node) {
      if (!node) return "";
      let out = "";
      const walk = (current) => {
        for (const child of current.childNodes || []) {
          if (child.nodeType === 3) out += child.textContent || "";
          else walk(child);
        }
      };
      walk(node);
      return out;
    }
    function textInk(node, background) {
      if (!node || !visible(node)) return null;
      return contrast(getComputedStyle(node).color, background);
    }
    function measureFooter(footer, view, background) {
      if (document.getAnimations) {
        try { document.getAnimations().forEach((anim) => { try { anim.finish(); } catch (ignored) {} }); } catch (ignored) {}
      }
      const tokens = Array.from(footer.querySelectorAll(".bob-freshness-group"));
      const visibleTokens = tokens.filter(visible);
      const context = footer.querySelector(".bob-freshness-context");
      const detail = footer.querySelector(".bob-freshness-detail");
      const hint = footer.querySelector(".bob-freshness-hint");
      const meter = footer.querySelector(".bob-freshness-meter");
      const due = footer.querySelector(".bob-freshness-due");
      const linkPrev = footer.querySelector(".bob-freshness-link-prev");
      const linkNext = footer.querySelector(".bob-freshness-link-next");
      const linkStatus = footer.querySelector(".bob-freshness-link-status");
      const result = {
        panel: footer.getAttribute("data-walker-panel"),
        dueText: view && view.dueText ? String(view.dueText) : "",
        contextText: view && view.contextText ? String(view.contextText) : "",
        hintText: view && view.hintText ? String(view.hintText) : "",
        overflow: footer.scrollWidth - footer.clientWidth,
        hostHeight: footer.getBoundingClientRect().height,
        dueContrast: textInk(due, background),
        contextContrast: textInk(context, background),
        detailContrast: textInk(detail, background),
        hintContrast: textInk(hint, background),
        meterContrast: textInk(meter, background),
        groups: visibleTokens.map((token) => ({
          key: token.getAttribute("data-review-tier") || token.textContent,
          contrast: contrast(getComputedStyle(token).color, background),
        })),
        allGroupColors: tokens.map((token) => ({
          key: token.getAttribute("data-review-tier") || token.textContent,
          color: getComputedStyle(token).color,
        })),
        linkPrev: linkPrev && visible(linkPrev) ? {
          text: chipText(linkPrev),
          contrast: resolvedContrast(getComputedStyle(linkPrev).color, background),
          dashed: linkPrev.classList.contains("bob-freshness-link-create"),
          disabled: linkPrev.disabled === true,
        } : null,
        linkNext: linkNext && visible(linkNext) ? {
          text: chipText(linkNext),
          contrast: resolvedContrast(getComputedStyle(linkNext).color, background),
          dashed: linkNext.classList.contains("bob-freshness-link-create"),
          disabled: linkNext.disabled === true,
        } : null,
        linkStatus: linkStatus && visible(linkStatus) ? linkStatus.textContent : "",
      };
      if (view && (view.panel === "links" || view.panel === "bank")) {
        const wantPrev = view.linkPrev ? view.linkPrev.text : null;
        const wantNext = view.linkNext ? view.linkNext.text : null;
        result.linksMatch = (result.linkPrev ? result.linkPrev.text : null) === wantPrev
          && (result.linkNext ? result.linkNext.text : null) === wantNext;
      }
      return result;
    }
    // Integrated bar: one footer host plus the Keep inbox chip and a
    // production-rendered selector, mirroring status-bar DOM order (footer,
    // keep, selector). Repainting modes here proves invariant 7: the
    // selector rect never moves while panel widths change.
    function buildIntegratedBar(root) {
      const bar = document.createElement("div");
      bar.className = "preview-status-bar";
      const footer = document.createElement("div");
      bar.appendChild(footer);
      const keep = document.createElement("div");
      keep.className = "preview-keep";
      keep.textContent = "▢ 3";
      bar.appendChild(keep);
      const selector = document.createElement("div");
      selector.className = "bob-bracket-mode";
      bar.appendChild(selector);
      root.appendChild(bar);
      const selectorParts = nav.ensureBracketModeDom(selector);
      return { bar, footer, keep, selector, selectorParts };
    }
    function paintIntegratedMode(integrated, mode, views, previousMode) {
      const started = performance.now();
      ledger.freshnessFooterPaint(integrated.footer, views[mode]);
      const painted = nav.paintBracketModeIndicator(
        integrated.selector, integrated.selectorParts, nav.buildBracketModeView(mode), previousMode,
      );
      integrated.selectorParts = painted || integrated.selectorParts;
      const rect = integrated.selector.getBoundingClientRect();
      const main = integrated.footer.querySelector(".bob-freshness-main");
      return {
        mode,
        panel: integrated.footer.getAttribute("data-walker-panel"),
        footerWidth: integrated.footer.getBoundingClientRect().width,
        contentWidth: main ? main.getBoundingClientRect().width : 0,
        barHeight: integrated.bar.getBoundingClientRect().height,
        selectorRect: { x: rect.x, y: rect.y, width: rect.width, height: rect.height },
        swapMs: performance.now() - started,
      };
    }
    function nextFrame() {
      return new Promise((resolve) => requestAnimationFrame(() => requestAnimationFrame(resolve)));
    }
    async function render(width, theme) {
      document.body.className = `theme-${theme}`;
      const root = document.querySelector("#preview-root");
      root.replaceChildren();
      root.style.width = `${width}px`;
      const measurement = [];
      let allTierColors = {};
      for (const fixture of panelFixtures) {
        const section = document.createElement("section");
        section.className = "preview-case";
        const heading = document.createElement("h2");
        heading.className = "preview-title";
        heading.textContent = fixture.title;
        section.appendChild(heading);
        const bar = document.createElement("div");
        bar.className = "preview-status-bar";
        const footer = document.createElement("div");
        bar.appendChild(footer);
        section.appendChild(bar);
        root.appendChild(section);
        const view = fixture.make();
        ledger.freshnessFooterPaint(footer, view);
        const background = getComputedStyle(bar).backgroundColor;
        const entry = { id: fixture.id, ...measureFooter(footer, view, background) };
        if (fixture.id === "s-all") {
          allTierColors = Object.fromEntries(entry.allGroupColors.map((item) => [item.key, item.color]));
        }
        measurement.push(entry);
      }
      const integratedRoot = document.createElement("section");
      integratedRoot.className = "preview-case";
      const integrated = buildIntegratedBar(integratedRoot);
      root.appendChild(integratedRoot);
      const views = {
        s: reviewFixtures[1].make(),
        w: laneFixtures[0].make(),
        n: linksFixtures[0].make(),
      };
      const modes = [];
      let previousMode;
      for (const mode of ["s", "w", "n"]) {
        const painted = paintIntegratedMode(integrated, mode, views, previousMode);
        previousMode = mode;
        await nextFrame();
        const rect = integrated.selector.getBoundingClientRect();
        modes.push({
          ...painted,
          settledPanel: integrated.footer.getAttribute("data-walker-panel"),
          settledSelectorRect: { x: rect.x, y: rect.y, width: rect.width, height: rect.height },
        });
      }
      return { width, theme, fixtures: measurement, allTierColors, integrated: modes };
    }

    window.walkerFooterPreview = { render, fixtureIds: panelFixtures.map((item) => item.id) };
    window.__previewReady = true;
  })();
  </script>
</body>
